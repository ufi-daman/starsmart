name: Build & Deploy

on:
  push:
    branches: [main]
  # WP webhook spouští tento workflow přes repository_dispatch
  repository_dispatch:
    types: [wp-content-updated]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: astro-theme/package-lock.json

      - name: Install dependencies
        working-directory: astro-theme
        run: npm ci

      - name: Build
        working-directory: astro-theme
        run: npm run build
        env:
          WP_API_URL: ${{ secrets.WP_API_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: astro-theme/dist
          vercel-args: '--prod'
